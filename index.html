<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>VTX Kho Container</title>
    <style>
        :root {
            font-family: Inter, system-ui, Arial, sans-serif;
            color: #17263d;
            background: #f3f6fb
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0
        }

        button,
        input,
        select {
            font: inherit
        }

        button {
            cursor: pointer
        }

        .app {
            display: flex;
            min-height: 100vh
        }

        .side {
            width: 235px;
            background: #11243e;
            color: #e9f2ff;
            padding: 24px 15px;
            flex-shrink: 0
        }

        .brand {
            font-weight: 800;
            font-size: 21px;
            padding: 5px 12px 27px
        }

        .brand span {
            color: #5bc3ff
        }

        .nav {
            display: block;
            width: 100%;
            padding: 13px;
            text-align: left;
            color: #c7d6e9;
            border: 0;
            border-radius: 10px;
            background: transparent;
            margin: 3px 0
        }

        .nav.active,
        .nav:hover {
            background: #274566;
            color: white
        }

        .main {
            flex: 1;
            min-width: 0;
            padding: 30px;
            max-width: 1500px
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 23px
        }

        h1 {
            font-size: 26px;
            margin: 0
        }

        h2 {
            font-size: 18px;
            margin: 0 0 18px
        }

        .muted {
            color: #728198;
            font-size: 13px
        }

        .primary {
            background: #2265db;
            color: white;
            border: 0;
            border-radius: 9px;
            padding: 11px 16px;
            font-weight: 650
        }

        .secondary {
            background: #eaf0f8;
            color: #23446c;
            border: 0;
            border-radius: 8px;
            padding: 9px 12px
        }

        .danger {
            color: #bf354b
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 20px
        }

        .card,
        .panel {
            background: white;
            border: 1px solid #e4eaf2;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 3px 16px #19365a07
        }

        .card b {
            font-size: 27px;
            display: block;
            margin-top: 12px
        }

        .panel {
            margin-bottom: 18px;
            overflow: auto
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 16px
        }

        input,
        select {
            border: 1px solid #d8e0ec;
            border-radius: 8px;
            padding: 10px;
            background: white;
            min-width: 0
        }

        input[type=file] {
            width: 100%
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 14px
        }

        th {
            text-align: left;
            color: #73839b;
            font-size: 12px;
            font-weight: 650;
            background: #f8fafd
        }

        th,
        td {
            padding: 13px 11px;
            border-bottom: 1px solid #edf1f6;
            white-space: nowrap
        }

        td button {
            border: 0;
            background: transparent;
            color: #2368d5
        }

        .row-actions {
            display: flex;
            gap: 5px
        }

        .row-actions button {
            white-space: nowrap
        }

        .row-actions .delete {
            color: #bf354b
        }

        .management {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px
        }

        .management button {
            font-size: 12px
        }

        .tag {
            display: inline-block;
            background: #e7f2ff;
            color: #2360b7;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 12px
        }

        .layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 18px
        }

        .yard-viewport {
            width: 100%;
            height: min(68vh, 680px);
            min-height: 420px;
            overflow: auto;
            overscroll-behavior: contain;
            border: 1px solid #d5dfeb;
            border-radius: 14px;
            background: #f8fafc
        }

        .yard {
            background: #edf3f9;
            border: 2px dashed #c5d2e4;
            border-radius: 14px;
            min-height: 420px;
            min-width: 100%;
            position: relative;
            overflow: visible;
            background-image: linear-gradient(#dce5f0 1px, transparent 1px), linear-gradient(90deg, #dce5f0 1px, transparent 1px);
            background-size: 32px 32px
        }

        .slot {
            position: absolute;
            width: 225px;
            min-height: 128px;
            border-radius: 9px;
            border: 2px solid #4177a8;
            background: #d9edfa;
            box-shadow: 0 4px 10px #3456781a;
            padding: 12px;
            cursor: grab;
            touch-action: none;
            user-select: none
        }

        .slot b {
            display: block
        }

        .slot small {
            display: block;
            margin-top: 8px;
            color: #42637f
        }

        .slot.rented {
            border-color: var(--rental-color, #f59e0b);
            background: var(--rental-color, #f59e0b);
            color: #17263d
        }

        .slot.rented small {
            color: #17263d
        }

        .slot.occupied {
            background: #a8d9c3;
            border-color: #39916d;
            color: #123a2a
        }

        .slot.occupied small {
            color: #123a2a
        }

        .slot .goods-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 8px
        }

        .slot .goods-line {
            font-size: 12px;
            line-height: 1.35;
            border-top: 1px solid #295d4730;
            padding-top: 5px;
            overflow-wrap: anywhere
        }

        .slot .goods-total {
            font-size: 12px;
            font-weight: 750;
            margin-top: 8px;
            border-top: 1px solid #295d4740;
            padding-top: 7px
        }

        .slot.vacant {
            background: #d1d5db;
            border-color: #9ca3af
        }

        .slot.vacant small {
            color: #374151
        }

        .slot.selected {
            outline: 3px solid #f6a63d
        }

        .formgrid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 650;
            color: #65768d;
            margin-bottom: 5px
        }

        .field input,
        .field select {
            width: 100%
        }

        .modalback {
            position: fixed;
            inset: 0;
            background: #07172c9c;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 10
        }

        .modal {
            background: white;
            padding: 24px;
            border-radius: 16px;
            width: min(700px, 100%);
            max-height: 90vh;
            overflow: auto
        }

        .modalhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px
        }

        .hidden {
            display: none !important
        }

        .empty {
            color: #8290a3;
            text-align: center;
            padding: 25px
        }

        .login {
            max-width: 420px;
            margin: 12vh auto;
            background: white;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 12px 40px #18345c20
        }

        .login input {
            width: 100%;
            margin: 8px 0
        }

        .login button {
            width: 100%;
            margin-top: 12px
        }

        .hint {
            font-size: 12px;
            color: #7a8799;
            line-height: 1.6
        }

        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #193c64;
            color: white;
            padding: 14px 20px;
            border-radius: 10px;
            z-index: 30
        }

        .thumb {
            width: 44px;
            height: 40px;
            object-fit: cover;
            border-radius: 5px
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px
        }

        @media(max-width:950px) {
            .cards {
                grid-template-columns: repeat(2, 1fr)
            }

            .layout {
                grid-template-columns: 1fr
            }

            .side {
                width: 75px;
                padding: 18px 7px
            }

            .brand {
                font-size: 13px;
                padding: 5px
            }

            .nav {
                font-size: 0;
                text-align: center
            }

            .nav::first-letter {
                font-size: 22px
            }
        }

        @media(max-width:620px) {
            .app {
                display: block
            }

            .side {
                width: 100%;
                display: flex;
                overflow-x: auto;
                padding: 8px
            }

            .brand {
                white-space: nowrap;
                padding: 13px
            }

            .nav {
                font-size: 12px;
                white-space: nowrap;
                width: auto
            }

            .main {
                padding: 16px
            }

            .cards {
                gap: 8px
            }

            .card {
                padding: 13px
            }

            .card b {
                font-size: 20px
            }

            .top {
                align-items: flex-start
            }

            .formgrid {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <div id="auth" class="login hidden">
        <h1>📦 VTX Warehouse</h1>
        <p class="muted">Đăng nhập để quản lý kho trực tuyến</p><input id="email" type="email"
            placeholder="Email"><input id="password" type="password" placeholder="Mật khẩu"><button class="primary"
            onclick="signIn()">Đăng nhập</button><button class="secondary" onclick="signUp()">Đăng ký tài khoản</button>
        <p class="hint">Tạo tài khoản chỉ dành cho nhân viên được cấp quyền truy cập dữ liệu.</p>
    </div>
    <div id="app" class="app">
        <aside class="side">
            <div class="brand">📦 <span>VTX</span> Kho</div><button class="nav active" data-tab="stock">▤ Hàng
                hóa</button><button class="nav" data-tab="yard">▦ Sơ đồ cont</button><button class="nav"
                data-tab="cost">₫ Công nợ</button><button class="nav" data-tab="report">▥ Báo cáo tháng</button><button
                class="nav" onclick="logout()">↪ Đăng xuất</button>
        </aside>
        <main class="main">
            <div class="top">
                <div>
                    <h1 id="heading">Quản lý hàng hóa</h1>
                    <div class="muted">Quản lý bãi và hàng hóa tập trung</div>
                </div>
                <div id="actions"></div>
            </div>
            <div id="content"></div>
        </main>
    </div>
    <div id="modal" class="modalback hidden">
        <div class="modal">
            <div class="modalhead">
                <h2 id="modalTitle"></h2><button class="secondary" onclick="closeModal()">✕</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>
    <div id="toast" class="toast hidden"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Điền thông tin dự án Supabase tại đây khi deploy online.
        const SUPABASE_URL = 'https://ufkvfaksnpluqfchnftg.supabase.co'; const SUPABASE_ANON_KEY = 'sb_publishable_d5cRNsNTK5pwkgaPVXMUag_dPNMgw4X';
        const remote = !!(SUPABASE_URL && SUPABASE_ANON_KEY); const sb = remote ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
        let db = { yards: [], slots: [], lots: [], moves: [], costs: [], debts: [] }, tab = 'stock', selectedSlot = null;
        const uid = () => crypto.randomUUID(), today = () => new Date().toISOString().slice(0, 10), money = n => Number(n || 0).toLocaleString('vi-VN') + ' ₫', num = n => Number(n || 0).toLocaleString('vi-VN'), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])), get = (id) => document.getElementById(id), slotName = id => db.slots.find(x => x.id === id)?.name || '—', yardName = id => db.yards.find(x => x.id === id)?.name || '—', lotPackages = id => { let l = db.lots.find(x => x.id === id); if (!l) return 0; return Math.max(0, db.moves.filter(x => x.lot_id === id).reduce((n, x) => n + ((x.kind === 'IN' || x.kind === 'TRANSFER_IN') ? 1 : -1) * Number(x.packages ?? (Number(x.qty) / kgPerPackage(l))), 0)) }, kgPerPackage = l => Number(l?.kg_per_package) || Number(l?.quantity || 0) / Number(l?.packages || 1), lotKg = id => db.moves.filter(x => x.lot_id === id).reduce((n, x) => { let l = db.lots.find(z => z.id === id); return n + ((x.kind === 'IN' || x.kind === 'TRANSFER_IN') ? 1 : -1) * Number(x.packages ?? (Number(x.qty) / kgPerPackage(l))) * kgPerPackage(l) }, 0), lotQty = id => db.moves.filter(x => x.lot_id === id).reduce((n, x) => n + ((x.kind === 'IN' || x.kind === 'TRANSFER_IN') ? 1 : -1) * Number(x.qty), 0), slotLots = id => db.lots.filter(x => x.slot_id === id && lotQty(x.id) > 0);
        function moveLabel(k) { return ({ IN: 'Nhập', OUT: 'Xuất', TRANSFER_OUT: 'Chuyển đi', TRANSFER_IN: 'Nhận chuyển' })[k] || k }
        function moveSlotName(m) { let l = db.lots.find(x => x.id === m.lot_id); return slotName(m.kind === 'TRANSFER_OUT' ? (m.from_slot_id || l?.slot_id) : (m.kind === 'TRANSFER_IN' ? (m.to_slot_id || l?.slot_id) : l?.slot_id)) }
        function notice(t) { get('toast').textContent = t; get('toast').classList.remove('hidden'); setTimeout(() => get('toast').classList.add('hidden'), 3200) }
        function seed() { let y = uid(), a = uid(), b = uid(), l = uid(), m = uid(); db = { yards: [{ id: y, name: 'VTX' }], slots: [{ id: a, yard_id: y, name: '1-VTX', x: 38, y: 48 }, { id: b, yard_id: y, name: '2-VTX', x: 220, y: 48 }], lots: [{ id: l, source_cont: 'TCLU1234567', slot_id: a, product: 'Chân gà Mỹ', customer: 'Khách hàng A', packages: 300, quantity: 6000, kg_per_package: 20, unit: 'kg', entry_date: today(), image_url: '' }, { id: m, source_cont: 'HDMU1324567', slot_id: a, product: 'Chân gà Brazil', customer: 'Khách hàng B', packages: 200, quantity: 5000, kg_per_package: 25, unit: 'kg', entry_date: today(), image_url: '' }], moves: [{ id: uid(), lot_id: l, kind: 'IN', qty: 6000, packages: 300, date: today() }, { id: uid(), lot_id: m, kind: 'IN', qty: 5000, packages: 200, date: today() }], costs: [{ id: uid(), lot_id: l, handling: 1500000, transport: 800000, extra: 0, electric_start: today(), electric_end: '', electric_daily: 50000, paid: 0, date: today() }] } }
        function persist() { if (!remote) localStorage.setItem('vtx-demo', JSON.stringify(db)) }
        async function load() { if (remote) { try { for (let t of Object.keys(db)) { let { data, error } = await sb.from(t).select('*'); if (error) throw error; db[t] = data || [] } } catch (e) { notice('Lỗi tải dữ liệu: ' + e.message) } } else { let s = localStorage.getItem('vtx-demo'); if (s) { try { db = JSON.parse(s); db.debts = db.debts || [] } catch { seed() } } else seed(); persist() } render() }
        async function save(table, obj) { if (remote) { let { error } = await sb.from(table).insert(obj); if (error) throw error } else { db[table].push(obj); persist() } }
        async function update(table, id, changes) { if (remote) { let { error } = await sb.from(table).update(changes).eq('id', id); if (error) throw error } else { Object.assign(db[table].find(x => x.id === id), changes); persist() } }
        async function remove(table, id) { if (remote) { let { error } = await sb.from(table).delete().eq('id', id); if (error) throw error } else { db[table] = db[table].filter(x => x.id !== id); persist() } }
        async function reload() { await load() }
        function changeTab(t) { tab = t; document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === t)); render() }
        document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => changeTab(b.dataset.tab));
        function render() { let titles = { stock: 'Quản lý hàng hóa', yard: 'Sơ đồ container', cost: 'Công nợ & chi phí', report: 'Báo cáo hàng tháng' }; get('heading').textContent = titles[tab]; get('actions').innerHTML = ({ stock: '<button class="primary" onclick="formLot()">+ Nhập hàng</button> <button class="secondary" onclick="formOut()">↗ Xuất hàng</button> <button class="secondary" onclick="formTransfer()">⇄ Chuyển kho</button>', yard: '<button class="primary" onclick="formYard()">+ Thêm bãi</button> <button class="secondary" onclick="formSlot()">+ Thêm cont</button>', cost: '<button class="primary" onclick="formCost()">+ Tạo công nợ</button>', report: '' })[tab]; get('content').innerHTML = ({ stock: stock, yard: yard, cost: cost, report: report })[tab](); if (tab === 'yard') { const select = get('yardSelect'); if (select) drawYard(select.value) } }
        const card = (title, value, sub) => `<div class="card"><span class="muted">${title}</span><b>${value}</b><span class="muted">${sub}</span></div>`;
        function lotTable(arr) { return `<table><thead><tr><th>Ảnh</th><th>Cont đầu vào</th><th>Loại hàng</th><th>Khách hàng</th><th>Vị trí lưu</th><th>Số kiện nhập</th><th>Kg/kiện</th><th>Tồn (kiện / kg)</th><th>Ngày vào</th><th>Thao tác</th></tr></thead><tbody>${arr.map(l => `<tr><td>${l.image_url ? `<img class="thumb" src="${esc(l.image_url)}">` : '📦'}</td><td><b>${esc(l.source_cont)}</b></td><td>${esc(l.product)}</td><td>${esc(l.customer)}</td><td><span class="tag">${esc(slotName(l.slot_id))}</span></td><td>${num(l.packages)}</td><td>${num(kgPerPackage(l))} kg</td><td><b>${num(lotPackages(l.id))} kiện / ${num(lotKg(l.id))} kg</b></td><td>${esc(l.entry_date)}</td><td><div class="row-actions"><button onclick="editLot('${l.id}')">✎ Sửa</button><button class="delete" onclick="deleteLot('${l.id}')">🗑 Xóa</button></div></td></tr>`).join('') || '<tr><td colspan="10" class="empty">Chưa có hàng hóa</td></tr>'}</tbody></table>` }
        function stock() { return `<div class="panel"><div class="toolbar"><input id="search" placeholder="Tìm cont, hàng, khách hàng..." oninput="filterStock()" style="min-width:260px"><span class="muted">Tồn kho tính từ lịch sử nhập/xuất</span></div><div id="stockTable">${lotTable(db.lots)}</div></div><div class="panel"><h2>Lịch sử nhập xuất</h2><table><tr><th>Ngày</th><th>Loại</th><th>Hàng hóa</th><th>Số kiện</th><th>Khối lượng (kg)</th><th>Cont lưu kho</th></tr>${db.moves.slice().reverse().map(m => `<tr><td>${esc(m.date)}</td><td>${moveLabel(m.kind)}</td><td>${esc(db.lots.find(l => l.id === m.lot_id)?.product || '—')}</td><td>${num(m.packages ?? (Number(m.qty) * Number(db.lots.find(l => l.id === m.lot_id)?.packages || 0) / Number(db.lots.find(l => l.id === m.lot_id)?.quantity || 1)))}</td><td>${num(m.packages != null ? Number(m.packages) * kgPerPackage(db.lots.find(l => l.id === m.lot_id)) : m.qty)}</td><td>${esc(moveSlotName(m))}</td></tr>`).join('')}</table></div>` }
        function filterStock() { let q = get('search').value.toLowerCase(); get('stockTable').innerHTML = lotTable(db.lots.filter(l => [l.source_cont, l.product, l.customer, slotName(l.slot_id)].some(v => String(v).toLowerCase().includes(q)))) }
        function yard() { let y = db.yards[0]; if (!y) return '<div class="panel empty">Chưa có bãi. Nhấn “Thêm bãi” để bắt đầu.</div>'; return `<div class="management" id="yardManage"></div><div class="toolbar"><select id="yardSelect" onchange="selectedSlot=null;drawYard(this.value)">${db.yards.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><span class="muted">Kéo thả container để thay đổi vị trí. Bấm container để xem hàng hoặc đánh dấu cho thuê. Xám = trống; xanh = có hàng (hiện loại hàng, kiện, kg); màu tùy chọn = cho thuê.</span></div><div class="layout"><div class="panel"><h2>Mặt bằng bãi</h2><div class="management"><span class="muted">Cuộn ngang / dọc để xem toàn bộ cont · Giữ và kéo để di chuyển</span></div><div class="yard-viewport" id="yardViewport"><div class="yard" id="yardCanvas"></div></div></div><div class="panel" id="slotInfo"><h2>Chi tiết container</h2><p class="muted">Chọn một container trên sơ đồ.</p></div></div>` }
        function safeRentalColor(c) { return /^#[0-9a-fA-F]{6}$/.test(c || '') ? c : '#fbbf24' }
        function slotInventory(id) { return slotLots(id).map(l => ({ lot: l, packages: lotPackages(l.id), kg: lotKg(l.id) })).filter(x => x.packages > 0) }
        function slotSummary(id) { let items = slotInventory(id); return { items, packages: items.reduce((n, x) => n + x.packages, 0), kg: items.reduce((n, x) => n + x.kg, 0) } }
        function drawYard(id) {
            let canvas = get('yardCanvas'); if (!canvas) return;
            let actions = get('yardManage'); if (actions) actions.innerHTML = `<button class="secondary" onclick="editYard('${id}')">✎ Sửa tên bãi</button><button class="secondary danger" onclick="deleteYard('${id}')">🗑 Xóa bãi</button>`;
            let slots = db.slots.filter(s => s.yard_id === id), viewport = get('yardViewport');
            // The map grows to fit every saved position. The viewport scrolls independently.
            let maxX = Math.max(0, ...slots.map(s => (Number(s.x) || 0) + 245)), maxY = Math.max(0, ...slots.map(s => (Number(s.y) || 0) + Math.max(160, 135 + slotInventory(s.id).length * 52)));

            openModal('Quản lý cho thuê container — ' + esc(s.name), `<form id="rentalForm" class="formgrid"><div class="field"><label>Trạng thái</label><select name="status"><option value="rented">Đang cho thuê</option><option value="vacant">Trả container / Đánh dấu trống</option></select></div>${field('Tên khách thuê', 'rental_customer', 'text', 'placeholder="A Đoàn"')}${field('Ngày bắt đầu thuê', 'rental_start', 'date', '')}${field('Màu hiển thị trên sơ đồ', 'rental_color', 'color', '')}<div class="hint" style="grid-column:1/-1">Đánh dấu cho thuê không tạo phiếu nhập hàng, không thay đổi số kiện hoặc kg tồn. Khi trả cont, màu trở về xám nếu không còn hàng.</div><div style="grid-column:1/-1"><button class="primary">Lưu trạng thái</button></div></form>`);
            const f = get('rentalForm'); f.elements.status.value = s.rental_customer ? 'rented' : 'vacant'; f.elements.rental_customer.value = s.rental_customer || ''; f.elements.rental_start.value = s.rental_start || today(); f.elements.rental_color.value = safeRentalColor(s.rental_color); const toggle = () => { let on = f.elements.status.value === 'rented'; for (let k of ['rental_customer', 'rental_start', 'rental_color']) f.elements[k].disabled = !on }; f.elements.status.onchange = toggle; toggle();
            f.onsubmit = async e => {
                e.preventDefault(); let renting = f.elements.status.value === 'rented', customer = f.elements.rental_customer.value.trim(), date = f.elements.rental_start.value;
                if (renting && (!customer || !date)) return notice('Nhập tên khách thuê và ngày bắt đầu');
                if (renting && slotLots(id).length) return notice('Container đang chứa hàng. Hãy chuyển/xuất hết hàng trước khi đánh dấu cho thuê riêng.');
                let changes = { rental_customer: renting ? customer : null, rental_start: renting ? date : null, rental_color: renting ? f.elements.rental_color.value : null };
                try { await update('slots', id, changes); closeModal(); await reload(); notice(renting ? 'Đã đánh dấu container cho ' + customer + ' thuê' : 'Đã trả container, chuyển về trạng thái trống') } catch (err) { notice(err.message) }
            };
        }
        function formYard() { openModal('Thêm bãi container', `<form id="f">${field('Tên bãi', 'name', 'text', 'required placeholder="VTX"')}<p><button class="primary">Lưu bãi</button></p></form>`); get('f').onsubmit = async e => { e.preventDefault(); try { await save('yards', { id: uid(), name: e.target.name.value.trim() }); closeModal(); await reload() } catch (err) { notice(err.message) } } }
        function formSlot() { if (!db.yards.length) return notice('Hãy thêm bãi trước'); openModal('Thêm container lưu kho', `<form id="f" class="formgrid">${choose('Bãi', 'yard_id', db.yards.map(y => `<option value="${y.id}">${esc(y.name)}</option>`).join(''))}${field('Tên cont', 'name', 'text', 'required placeholder="1-VTX"')}<div><button class="primary">Thêm container</button></div></form>`); get('f').onsubmit = async e => { e.preventDefault(); let d = Object.fromEntries(new FormData(e.target)); try { await save('slots', { id: uid(), yard_id: d.yard_id, name: d.name.trim(), x: 35 + (db.slots.filter(s => s.yard_id === d.yard_id).length % 4) * 255, y: 40 + Math.floor(db.slots.filter(s => s.yard_id === d.yard_id).length / 4) * 260 }); closeModal(); await reload() } catch (err) { notice(err.message) } } }
        function formCost() {
            openModal('Tạo công nợ theo khách hàng', `<form id="f" class="formgrid">
${field('Tên khách hàng', 'customer', 'text', 'required placeholder="A Đinh"')}
${field('Ngày ghi nhận', 'date', 'date', `value="${today()}" required`)}
${field('Tiền bốc/hạ hàng (₫)', 'handling', 'number', 'value="0" min="0" step="1"')}
${field('Tiền xe (₫)', 'transport', 'number', 'value="0" min="0" step="1"')}
${field('Phát sinh (₫)', 'extra', 'number', 'value="0" min="0" step="1"')}
${field('Container thuê lưu hàng', 'container_name', 'text', 'placeholder="1-VTX" list="slotNames"')}
<datalist id="slotNames">${db.slots.map(x => `<option value="${esc(x.name)}">`).join('')}</datalist>
${field('Ngày bắt đầu thuê', 'rental_start', 'date', '')}
${field('Ngày trả container', 'rental_end', 'date', '')}
<div class="field"><label>Số ngày thuê (tự tính)</label><input id="rentalDaysDisplay" readonly value="0 ngày"></div>
${field('Đơn giá thuê cont/ngày (₫)', 'rental_daily', 'number', 'value="0" min="0" step="1"')}
${field('Đã thanh toán (₫)', 'paid', 'number', 'value="0" min="0" step="1"')}
<div class="panel" style="grid-column:1/-1;margin:0;background:#f1f6ff"><b id="debtPreview">Tổng tiền: 0 ₫</b><div class="muted" id="debtBalance">Còn nợ: 0 ₫</div></div>
<div><button class="primary">Lưu công nợ</button></div></form>`);
            let f = get('f'); function preview() { let d = Object.fromEntries(new FormData(f)); d.rental_days = rentalDays(d.rental_start, d.rental_end); get('rentalDaysDisplay').value = d.rental_days + ' ngày'; get('rentalDaysDisplay').style.color = (d.rental_start && d.rental_end && d.rental_end < d.rental_start) ? '#bf354b' : ''; let total = debtTotal(d); get('debtPreview').textContent = 'Tổng tiền: ' + money(total); get('debtBalance').textContent = 'Còn nợ: ' + money(total - Number(d.paid || 0)) } f.addEventListener('input', preview); preview();
            f.onsubmit = async e => { e.preventDefault(); let d = Object.fromEntries(new FormData(f)); d.customer = d.customer.trim(); if (!d.customer) return notice('Vui lòng nhập tên khách hàng'); if (Boolean(d.rental_start) !== Boolean(d.rental_end)) return notice('Vui lòng nhập đủ ngày bắt đầu thuê và ngày trả'); if (d.rental_start && d.rental_end < d.rental_start) return notice('Ngày trả không được trước ngày bắt đầu thuê'); d.rental_start = d.rental_start || null; d.rental_end = d.rental_end || null; d.rental_days = rentalDays(d.rental_start, d.rental_end); if (Number(d.rental_daily) > 0 && !d.rental_start) return notice('Hãy nhập ngày bắt đầu thuê và ngày trả'); for (let k of ['handling', 'transport', 'extra', 'rental_days', 'rental_daily', 'paid']) { d[k] = Number(d[k] || 0); if (!Number.isFinite(d[k]) || d[k] < 0) return notice('Số tiền và số ngày phải không âm') } if (!Number.isInteger(d.rental_days)) return notice('Số ngày thuê phải là số nguyên'); if (d.rental_days > 0 && !d.container_name.trim()) return notice('Hãy nhập container thuê'); if (d.paid > debtTotal(d)) return notice('Số tiền đã trả không được vượt tổng tiền'); d.id = uid(); try { await save('debts', d); closeModal(); await reload() } catch (err) { notice(err.message) } }
        }
        // V7: CRUD có kiểm tra dữ liệu liên quan để không làm sai tồn kho.
        function hasStockHistory(l) { return db.moves.some(m => m.lot_id === l.id && m.kind !== 'IN') }
        function hasDependentLots(slotId) { return db.lots.some(l => l.slot_id === slotId) }
        async function deleteLot(id) { let l = db.lots.find(x => x.id === id); if (!l) return; if (hasStockHistory(l)) return notice('Không thể xóa lô đã xuất/chuyển. Hãy lập phiếu điều chỉnh tồn thay vì xóa lịch sử.'); if (db.costs.some(c => c.lot_id === id)) return notice('Lô này có chi phí liên kết, không thể xóa.'); if (!confirm(`Xóa lô ${l.product} (${l.packages} kiện) và phiếu nhập liên quan?`)) return; try { if (remote) { let { error } = await sb.rpc('delete_unused_lot', { p_lot_id: id }); if (error) throw error } else { db.moves = db.moves.filter(m => m.lot_id !== id); db.lots = db.lots.filter(x => x.id !== id); persist() } await reload(); notice('Đã xóa lô hàng và phiếu nhập') } catch (e) { notice('Không xóa được: ' + e.message) } }
        function editLot(id) { let l = db.lots.find(x => x.id === id); if (!l) return; let locked = hasStockHistory(l); openModal('Chỉnh sửa lô hàng', `<form id="f" class="formgrid">${field('Cont đầu vào', 'source_cont', 'text', 'required')}${choose('Container lưu kho', 'slot_id', slotOpts())}${field('Tên loại hàng', 'product', 'text', 'required')}${field('Khách hàng', 'customer', 'text', 'required')}${field('Số kiện nhập', 'packages', 'number', `required min="1" step="1" ${locked ? 'disabled' : ''}`)}${field('Kg/kiện', 'kg_per_package', 'number', `required min="0.001" step="any" ${locked ? 'disabled' : ''}`)}${field('Ngày vào', 'entry_date', 'date', 'required')}<div class="field"><label>Ảnh hiện tại</label>${l.image_url ? `<img class="thumb" src="${esc(l.image_url)}">` : 'Không có ảnh'}</div>${field('Thay ảnh (không bắt buộc)', 'image', 'file', 'accept="image/*"')}<div style="grid-column:1/-1" class="hint">${locked ? 'Lô đã xuất/chuyển: khóa số kiện và kg/kiện để bảo toàn lịch sử.' : ''}</div><div><button class="primary">Lưu thay đổi</button></div></form>`); let f = get('f'); for (let k of ['source_cont', 'slot_id', 'product', 'customer', 'packages', 'kg_per_package', 'entry_date']) f.elements[k].value = l[k]; f.elements.slot_id.disabled = locked; f.onsubmit = async e => { e.preventDefault(); let d = Object.fromEntries(new FormData(f)); let changes = { source_cont: d.source_cont.trim(), product: d.product.trim(), customer: d.customer.trim(), entry_date: d.entry_date }; if (!locked) { let count = Number(d.packages), kg = Number(d.kg_per_package); if (!Number.isInteger(count) || count < 1 || !Number.isFinite(kg) || kg <= 0) return notice('Số kiện và kg/kiện không hợp lệ'); changes.packages = count; changes.kg_per_package = kg; changes.quantity = count * kg; changes.slot_id = d.slot_id } try { let file = f.elements.image.files[0]; if (file) { if (remote) { let path = uid() + '-' + file.name.replace(/[^a-zA-Z0-9.\-]/g, '_'), r = await sb.storage.from('goods').upload(path, file); if (r.error) throw r.error; changes.image_url = sb.storage.from('goods').getPublicUrl(path).data.publicUrl } else { if (file.size > 350000) throw Error('Ảnh demo tối đa 350KB'); changes.image_url = await new Promise(resolve => { let rd = new FileReader(); rd.onload = () => resolve(rd.result); rd.readAsDataURL(file) }) } } if (remote && !locked) { let { error } = await sb.rpc('update_unused_lot', { p_lot_id: id, p_source_cont: changes.source_cont, p_slot_id: changes.slot_id, p_product: changes.product, p_customer: changes.customer, p_packages: changes.packages, p_kg_per_package: changes.kg_per_package, p_entry_date: changes.entry_date, p_image_url: changes.image_url ?? l.image_url }); if (error) throw error } else { await update('lots', id, changes); if (!locked) { let m = db.moves.find(m => m.lot_id === id && m.kind === 'IN'); if (m) await update('moves', m.id, { packages: changes.packages, qty: changes.quantity, date: changes.entry_date }) } } closeModal(); await reload(); notice('Đã cập nhật lô hàng') } catch (err) { notice(err.message) } } }
        function editYard(id) { let y = db.yards.find(x => x.id === id); if (!y) return; openModal('Sửa bãi', `<form id="f">${field('Tên bãi', 'name', 'text', 'required')}<p><button class="primary">Lưu</button></p></form>`); get('f').elements.name.value = y.name; get('f').onsubmit = async e => { e.preventDefault(); try { await update('yards', id, { name: e.target.elements.name.value.trim() }); closeModal(); await reload(); notice('Đã sửa tên bãi') } catch (err) { notice(err.message) } } }
        async function deleteYard(id) { let y = db.yards.find(x => x.id === id); if (!y) return; if (db.slots.some(x => x.yard_id === id)) return notice('Bãi còn container. Hãy xóa các container trống trước.'); if (!confirm('Xóa bãi ' + y.name + '?')) return; try { await remove('yards', id); await reload(); notice('Đã xóa bãi') } catch (e) { notice(e.message) } }
        function editSlot(id) { let s = db.slots.find(x => x.id === id); if (!s) return; openModal('Sửa container', `<form id="f" class="formgrid">${choose('Bãi', 'yard_id', db.yards.map(y => `<option value="${y.id}">${esc(y.name)}</option>`).join(''))}${field('Tên container', 'name', 'text', 'required')}<div><button class="primary">Lưu</button></div></form>`); get('f').elements.yard_id.value = s.yard_id; get('f').elements.name.value = s.name; get('f').onsubmit = async e => { e.preventDefault(); let f = e.target; try { await update('slots', id, { yard_id: f.elements.yard_id.value, name: f.elements.name.value.trim() }); closeModal(); await reload(); notice('Đã sửa container') } catch (err) { notice(err.message) } } }
        async function deleteSlot(id) { let s = db.slots.find(x => x.id === id); if (!s) return; if (hasDependentLots(id)) return notice('Container còn lô hàng hoặc lịch sử lưu kho. Không thể xóa.'); if (!confirm('Xóa container ' + s.name + '?')) return; try { await remove('slots', id); selectedSlot = null; await reload(); notice('Đã xóa container') } catch (e) { notice(e.message) } }
        function editDebt(id) { let c = (db.debts || []).find(x => x.id === id); if (!c) return; formCost(); get('modalTitle').textContent = 'Sửa công nợ'; let f = get('f'); for (let k of ['customer', 'date', 'handling', 'transport', 'extra', 'container_name', 'rental_start', 'rental_end', 'rental_daily', 'paid']) f.elements[k].value = c[k] ?? ''; f.dispatchEvent(new Event('input')); f.querySelector('button.primary').textContent = 'Cập nhật công nợ'; let oldSubmit = f.onsubmit; f.onsubmit = async e => { e.preventDefault(); let d = Object.fromEntries(new FormData(f)); d.customer = d.customer.trim(); if (!d.customer) return notice('Thiếu khách hàng'); if (Boolean(d.rental_start) !== Boolean(d.rental_end) || d.rental_end && d.rental_end < d.rental_start) return notice('Ngày thuê/trả không hợp lệ'); d.rental_start = d.rental_start || null; d.rental_end = d.rental_end || null; d.rental_days = rentalDays(d.rental_start, d.rental_end); for (let k of ['handling', 'transport', 'extra', 'rental_daily', 'paid']) { d[k] = Number(d[k] || 0); if (!Number.isFinite(d[k]) || d[k] < 0) return notice('Số tiền không hợp lệ') } if (d.rental_daily > 0 && !d.rental_start) return notice('Nhập đủ ngày thuê và ngày trả'); if (d.rental_days > 0 && !d.container_name.trim()) return notice('Thiếu container thuê'); if (d.paid > debtTotal(d)) return notice('Đã trả vượt tổng công nợ'); try { await update('debts', id, d); closeModal(); await reload(); notice('Đã cập nhật công nợ') } catch (err) { notice(err.message) } } }
        async function deleteDebt(id) { let c = (db.debts || []).find(x => x.id === id); if (!c) return; if (!confirm(`Xóa công nợ của ${c.customer} ngày ${c.date}? Thao tác này không thể hoàn tác.`)) return; try { await remove('debts', id); await reload(); notice('Đã xóa công nợ') } catch (err) { notice(err.message) } }
        function exportCSV() { let m = get('reportMonth').value, rows = [['Ngày', 'Loại', 'Khách hàng', 'Tên hàng', 'Cont đầu vào', 'Cont lưu kho', 'Số kiện', 'Khối lượng (kg)']]; db.moves.filter(x => x.date.startsWith(m)).forEach(x => { let l = db.lots.find(z => z.id === x.lot_id); rows.push([x.date, moveLabel(x.kind), l?.customer, l?.product, l?.source_cont, moveSlotName(x), x.packages ?? (Number(x.qty) * Number(l?.packages || 0) / Number(l?.quantity || 1)), x.packages != null ? Number(x.packages) * kgPerPackage(l) : x.qty]) }); let csv = '\ufeff' + rows.map(r => r.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(',')).join('\r\n'), a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'bao-cao-' + m + '.csv'; a.click(); URL.revokeObjectURL(a.href) }
        async function signIn() { let { error } = await sb.auth.signInWithPassword({ email: get('email').value, password: get('password').value }); if (error) return notice(error.message); get('auth').classList.add('hidden'); get('app').classList.remove('hidden'); load() }
        async function signUp() { let { error } = await sb.auth.signUp({ email: get('email').value, password: get('password').value }); notice(error ? error.message : 'Đã gửi yêu cầu đăng ký. Kiểm tra email nếu cần xác minh.') }
        async function logout() { if (remote) { await sb.auth.signOut(); get('app').classList.add('hidden'); get('auth').classList.remove('hidden') } else notice('Bạn đang ở chế độ demo, không cần đăng nhập') }
        (async () => { if (remote) { let { data } = await sb.auth.getSession(); if (!data.session) { get('app').classList.add('hidden'); get('auth').classList.remove('hidden'); return } } await load() })();
    </script>
