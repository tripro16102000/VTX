<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>VTX Kho Container</title>
    <style>
        :root {
            font-family: Inter, system-ui, Arial, sans-serif;
            color: #17263d;
            background: #f3f6fb
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0
        }

        button,
        input,
        select {
            font: inherit
        }

        button {
            cursor: pointer
        }

        .app {
            display: flex;
            min-height: 100vh
        }

        .side {
            width: 235px;
            background: #11243e;
            color: #e9f2ff;
            padding: 24px 15px;
            flex-shrink: 0
        }

        .brand {
            font-weight: 800;
            font-size: 21px;
            padding: 5px 12px 27px
        }

        .brand span {
            color: #5bc3ff
        }

        .nav {
            display: block;
            width: 100%;
            padding: 13px;
            text-align: left;
            color: #c7d6e9;
            border: 0;
            border-radius: 10px;
            background: transparent;
            margin: 3px 0
        }

        .nav.active,
        .nav:hover {
            background: #274566;
            color: white
        }

        .main {
            flex: 1;
            min-width: 0;
            padding: 30px;
            max-width: 1500px
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 23px
        }

        h1 {
            font-size: 26px;
            margin: 0
        }

        h2 {
            font-size: 18px;
            margin: 0 0 18px
        }

        .muted {
            color: #728198;
            font-size: 13px
        }

        .primary {
            background: #2265db;
            color: white;
            border: 0;
            border-radius: 9px;
            padding: 11px 16px;
            font-weight: 650
        }

        .secondary {
            background: #eaf0f8;
            color: #23446c;
            border: 0;
            border-radius: 8px;
            padding: 9px 12px
        }

        .danger {
            color: #bf354b
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 20px
        }

        .card,
        .panel {
            background: white;
            border: 1px solid #e4eaf2;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 3px 16px #19365a07
        }

        .card b {
            font-size: 27px;
            display: block;
            margin-top: 12px
        }

        .panel {
            margin-bottom: 18px;
            overflow: auto
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 16px
        }

        input,
        select {
            border: 1px solid #d8e0ec;
            border-radius: 8px;
            padding: 10px;
            background: white;
            min-width: 0
        }

        input[type=file] {
            width: 100%
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 14px
        }

        th {
            text-align: left;
            color: #73839b;
            font-size: 12px;
            font-weight: 650;
            background: #f8fafd
        }

        th,
        td {
            padding: 13px 11px;
            border-bottom: 1px solid #edf1f6;
            white-space: nowrap
        }

        td button {
            border: 0;
            background: transparent;
            color: #2368d5
        }

        .tag {
            display: inline-block;
            background: #e7f2ff;
            color: #2360b7;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 12px
        }

        .layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 18px
        }

        .yard {
            background: #edf3f9;
            border: 2px dashed #c5d2e4;
            border-radius: 14px;
            min-height: 420px;
            position: relative;
            overflow: hidden;
            background-image: linear-gradient(#dce5f0 1px, transparent 1px), linear-gradient(90deg, #dce5f0 1px, transparent 1px);
            background-size: 32px 32px
        }

        .slot {
            position: absolute;
            width: 155px;
            min-height: 94px;
            border-radius: 9px;
            border: 2px solid #4177a8;
            background: #d9edfa;
            box-shadow: 0 4px 10px #3456781a;
            padding: 12px;
            cursor: grab;
            touch-action: none;
            user-select: none
        }

        .slot b {
            display: block
        }

        .slot small {
            display: block;
            margin-top: 8px;
            color: #42637f
        }

        .slot.selected {
            outline: 3px solid #f6a63d
        }

        .formgrid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 650;
            color: #65768d;
            margin-bottom: 5px
        }

        .field input,
        .field select {
            width: 100%
        }

        .modalback {
            position: fixed;
            inset: 0;
            background: #07172c9c;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 10
        }

        .modal {
            background: white;
            padding: 24px;
            border-radius: 16px;
            width: min(700px, 100%);
            max-height: 90vh;
            overflow: auto
        }

        .modalhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px
        }

        .hidden {
            display: none !important
        }

        .empty {
            color: #8290a3;
            text-align: center;
            padding: 25px
        }

        .login {
            max-width: 420px;
            margin: 12vh auto;
            background: white;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 12px 40px #18345c20
        }

        .login input {
            width: 100%;
            margin: 8px 0
        }

        .login button {
            width: 100%;
            margin-top: 12px
        }

        .hint {
            font-size: 12px;
            color: #7a8799;
            line-height: 1.6
        }

        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #193c64;
            color: white;
            padding: 14px 20px;
            border-radius: 10px;
            z-index: 30
        }

        .thumb {
            width: 44px;
            height: 40px;
            object-fit: cover;
            border-radius: 5px
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px
        }

        @media(max-width:950px) {
            .cards {
                grid-template-columns: repeat(2, 1fr)
            }

            .layout {
                grid-template-columns: 1fr
            }

            .side {
                width: 75px;
                padding: 18px 7px
            }

            .brand {
                font-size: 13px;
                padding: 5px
            }

            .nav {
                font-size: 0;
                text-align: center
            }

            .nav::first-letter {
                font-size: 22px
            }
        }

        @media(max-width:620px) {
            .app {
                display: block
            }

            .side {
                width: 100%;
                display: flex;
                overflow-x: auto;
                padding: 8px
            }

            .brand {
                white-space: nowrap;
                padding: 13px
            }

            .nav {
                font-size: 12px;
                white-space: nowrap;
                width: auto
            }

            .main {
                padding: 16px
            }

            .cards {
                gap: 8px
            }

            .card {
                padding: 13px
            }

            .card b {
                font-size: 20px
            }

            .top {
                align-items: flex-start
            }

            .formgrid {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <div id="auth" class="login hidden">
        <h1>📦 VTX Warehouse</h1>
        <p class="muted">Đăng nhập để quản lý kho trực tuyến</p><input id="email" type="email"
            placeholder="Email"><input id="password" type="password" placeholder="Mật khẩu"><button class="primary"
            onclick="signIn()">Đăng nhập</button><button class="secondary" onclick="signUp()">Đăng ký tài khoản</button>
        <p class="hint">Tạo tài khoản chỉ dành cho nhân viên được cấp quyền truy cập dữ liệu.</p>
    </div>
    <div id="app" class="app">
        <aside class="side">
            <div class="brand">📦 <span>VTX</span> Kho</div><button class="nav active" data-tab="dashboard">◫ Tổng
                quan</button><button class="nav" data-tab="stock">▤ Hàng hóa</button><button class="nav"
                data-tab="yard">▦ Sơ đồ cont</button><button class="nav" data-tab="cost">₫ Công nợ</button><button
                class="nav" data-tab="report">▥ Báo cáo tháng</button><button class="nav" onclick="logout()">↪ Đăng
                xuất</button>
        </aside>
        <main class="main">
            <div class="top">
                <div>
                    <h1 id="heading">Tổng quan kho</h1>
                    <div class="muted">Quản lý bãi và hàng hóa tập trung</div>
                </div>
                <div id="actions"></div>
            </div>
            <div id="content"></div>
        </main>
    </div>
    <div id="modal" class="modalback hidden">
        <div class="modal">
            <div class="modalhead">
                <h2 id="modalTitle"></h2><button class="secondary" onclick="closeModal()">✕</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>
    <div id="toast" class="toast hidden"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Điền thông tin dự án Supabase tại đây khi deploy online.
        const SUPABASE_URL = 'https://ufkvfaksnpluqfchnftg.supabase.co'; const SUPABASE_ANON_KEY = 'sb_publishable_d5cRNsNTK5pwkgaPVXMUag_dPNMgw4X';
        const remote = !!(SUPABASE_URL && SUPABASE_ANON_KEY); const sb = remote ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
        let db = { yards: [], slots: [], lots: [], moves: [], costs: [] }, tab = 'dashboard', selectedSlot = null;
        const uid = () => crypto.randomUUID(), today = () => new Date().toISOString().slice(0, 10), money = n => Number(n || 0).toLocaleString('vi-VN') + ' ₫', num = n => Number(n || 0).toLocaleString('vi-VN'), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])), get = (id) => document.getElementById(id), slotName = id => db.slots.find(x => x.id === id)?.name || '—', yardName = id => db.yards.find(x => x.id === id)?.name || '—', lotPackages = id => { let l = db.lots.find(x => x.id === id); if (!l) return 0; return Math.max(0, db.moves.filter(x => x.lot_id === id).reduce((n, x) => n + ((x.kind === 'IN' || x.kind === 'TRANSFER_IN') ? 1 : -1) * Number(x.packages ?? (Number(x.qty) / kgPerPackage(l))), 0)) }, kgPerPackage = l => Number(l?.kg_per_package) || Number(l?.quantity || 0) / Number(l?.packages || 1), lotKg = id => db.moves.filter(x => x.lot_id === id).reduce((n, x) => { let l = db.lots.find(z => z.id === id); return n + ((x.kind === 'IN' || x.kind === 'TRANSFER_IN') ? 1 : -1) * Number(x.packages ?? (Number(x.qty) / kgPerPackage(l))) * kgPerPackage(l) }, 0), lotQty = id => db.moves.filter(x => x.lot_id === id).reduce((n, x) => n + ((x.kind === 'IN' || x.kind === 'TRANSFER_IN') ? 1 : -1) * Number(x.qty), 0), slotLots = id => db.lots.filter(x => x.slot_id === id && lotQty(x.id) > 0);
        function moveLabel(k) { return ({ IN: 'Nhập', OUT: 'Xuất', TRANSFER_OUT: 'Chuyển đi', TRANSFER_IN: 'Nhận chuyển' })[k] || k }
        function moveSlotName(m) { let l = db.lots.find(x => x.id === m.lot_id); return slotName(m.kind === 'TRANSFER_OUT' ? (m.from_slot_id || l?.slot_id) : (m.kind === 'TRANSFER_IN' ? (m.to_slot_id || l?.slot_id) : l?.slot_id)) }
        function notice(t) { get('toast').textContent = t; get('toast').classList.remove('hidden'); setTimeout(() => get('toast').classList.add('hidden'), 3200) }
        function seed() { let y = uid(), a = uid(), b = uid(), l = uid(), m = uid(); db = { yards: [{ id: y, name: 'VTX' }], slots: [{ id: a, yard_id: y, name: '1-VTX', x: 38, y: 48 }, { id: b, yard_id: y, name: '2-VTX', x: 220, y: 48 }], lots: [{ id: l, source_cont: 'TCLU1234567', slot_id: a, product: 'Chân gà Mỹ', customer: 'Khách hàng A', packages: 300, quantity: 6000, kg_per_package: 20, unit: 'kg', entry_date: today(), image_url: '' }, { id: m, source_cont: 'HDMU1324567', slot_id: a, product: 'Chân gà Brazil', customer: 'Khách hàng B', packages: 200, quantity: 5000, kg_per_package: 25, unit: 'kg', entry_date: today(), image_url: '' }], moves: [{ id: uid(), lot_id: l, kind: 'IN', qty: 6000, packages: 300, date: today() }, { id: uid(), lot_id: m, kind: 'IN', qty: 5000, packages: 200, date: today() }], costs: [{ id: uid(), lot_id: l, handling: 1500000, transport: 800000, extra: 0, electric_start: today(), electric_end: '', electric_daily: 50000, paid: 0, date: today() }] } }
        function persist() { if (!remote) localStorage.setItem('vtx-demo', JSON.stringify(db)) }
        async function load() { if (remote) { try { for (let t of Object.keys(db)) { let { data, error } = await sb.from(t).select('*'); if (error) throw error; db[t] = data || [] } } catch (e) { notice('Lỗi tải dữ liệu: ' + e.message) } } else { let s = localStorage.getItem('vtx-demo'); if (s) { try { db = JSON.parse(s) } catch { seed() } } else seed(); persist() } render() }
        async function save(table, obj) { if (remote) { let { error } = await sb.from(table).insert(obj); if (error) throw error } else { db[table].push(obj); persist() } }
        async function update(table, id, changes) { if (remote) { let { error } = await sb.from(table).update(changes).eq('id', id); if (error) throw error } else { Object.assign(db[table].find(x => x.id === id), changes); persist() } }
        async function remove(table, id) { if (remote) { let { error } = await sb.from(table).delete().eq('id', id); if (error) throw error } else { db[table] = db[table].filter(x => x.id !== id); persist() } }
        async function reload() { await load() }
        function changeTab(t) { tab = t; document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === t)); render() }
        document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => changeTab(b.dataset.tab));
        function render() { let titles = { dashboard: 'Tổng quan kho', stock: 'Quản lý hàng hóa', yard: 'Sơ đồ container', cost: 'Công nợ & chi phí', report: 'Báo cáo hàng tháng' }; get('heading').textContent = titles[tab]; get('actions').innerHTML = ({ dashboard: '', stock: '<button class="primary" onclick="formLot()">+ Nhập hàng</button> <button class="secondary" onclick="formOut()">↗ Xuất hàng</button> <button class="secondary" onclick="formTransfer()">⇄ Chuyển kho</button>', yard: '<button class="primary" onclick="formYard()">+ Thêm bãi</button> <button class="secondary" onclick="formSlot()">+ Thêm cont</button>', cost: '<button class="primary" onclick="formCost()">+ Thêm chi phí</button>', report: '' })[tab]; get('content').innerHTML = ({ dashboard: dashboard, stock: stock, yard: yard, cost: cost, report: report })[tab](); if (tab === 'yard') enableDrag() }
        const card = (title, value, sub) => `<div class="card"><span class="muted">${title}</span><b>${value}</b><span class="muted">${sub}</span></div>`;
        function dashboard() { let total = db.lots.reduce((n, l) => n + lotPackages(l.id), 0), totalKg = db.lots.reduce((n, l) => n + lotKg(l.id), 0), due = db.costs.reduce((n, c) => n + costTotal(c) - Number(c.paid || 0), 0); return `<div class="cards">${card('Container lưu kho', db.slots.length, 'Tất cả bãi')}${card('Tổng số kiện tồn', num(total), 'Tồn theo từng lô')}${card('Tổng khối lượng tồn', num(totalKg) + ' kg', 'Tồn theo từng lô')}${card('Công nợ chưa thu', money(due), 'Bao gồm chi phí điện')}</div><div class="panel"><h2>Hàng nhập gần đây</h2>${lotTable(db.lots.slice().sort((a, b) => b.entry_date.localeCompare(a.entry_date)).slice(0, 8))}</div>` }
        function lotTable(arr) { return `<table><thead><tr><th>Ảnh</th><th>Cont đầu vào</th><th>Loại hàng</th><th>Khách hàng</th><th>Vị trí lưu</th><th>Số kiện nhập</th><th>Kg/kiện</th><th>Tồn (kiện / kg)</th><th>Ngày vào</th></tr></thead><tbody>${arr.map(l => `<tr><td>${l.image_url ? `<img class="thumb" src="${esc(l.image_url)}">` : '📦'}</td><td><b>${esc(l.source_cont)}</b></td><td>${esc(l.product)}</td><td>${esc(l.customer)}</td><td><span class="tag">${esc(slotName(l.slot_id))}</span></td><td>${num(l.packages)}</td><td>${num(kgPerPackage(l))} kg</td><td><b>${num(lotPackages(l.id))} kiện / ${num(lotKg(l.id))} kg</b></td><td>${esc(l.entry_date)}</td></tr>`).join('') || '<tr><td colspan="9" class="empty">Chưa có hàng hóa</td></tr>'}</tbody></table>` }
        function stock() { return `<div class="panel"><div class="toolbar"><input id="search" placeholder="Tìm cont, hàng, khách hàng..." oninput="filterStock()" style="min-width:260px"><span class="muted">Tồn kho tính từ lịch sử nhập/xuất</span></div><div id="stockTable">${lotTable(db.lots)}</div></div><div class="panel"><h2>Lịch sử nhập xuất</h2><table><tr><th>Ngày</th><th>Loại</th><th>Hàng hóa</th><th>Số kiện</th><th>Khối lượng (kg)</th><th>Cont lưu kho</th></tr>${db.moves.slice().reverse().map(m => `<tr><td>${esc(m.date)}</td><td>${moveLabel(m.kind)}</td><td>${esc(db.lots.find(l => l.id === m.lot_id)?.product || '—')}</td><td>${num(m.packages ?? (Number(m.qty) * Number(db.lots.find(l => l.id === m.lot_id)?.packages || 0) / Number(db.lots.find(l => l.id === m.lot_id)?.quantity || 1)))}</td><td>${num(m.packages != null ? Number(m.packages) * kgPerPackage(db.lots.find(l => l.id === m.lot_id)) : m.qty)}</td><td>${esc(moveSlotName(m))}</td></tr>`).join('')}</table></div>` }
        function filterStock() { let q = get('search').value.toLowerCase(); get('stockTable').innerHTML = lotTable(db.lots.filter(l => [l.source_cont, l.product, l.customer, slotName(l.slot_id)].some(v => String(v).toLowerCase().includes(q)))) }
        function yard() { let y = db.yards[0]; if (!y) return '<div class="panel empty">Chưa có bãi. Nhấn “Thêm bãi” để bắt đầu.</div>'; return `<div class="toolbar"><select id="yardSelect" onchange="selectedSlot=null;drawYard(this.value)">${db.yards.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><span class="muted">Kéo thả container để thay đổi vị trí. Bấm vào container để xem hàng bên trong.</span></div><div class="layout"><div class="panel"><h2>Mặt bằng bãi</h2><div class="yard" id="yardCanvas"></div></div><div class="panel" id="slotInfo"><h2>Chi tiết container</h2><p class="muted">Chọn một container trên sơ đồ.</p></div></div>` }
        function drawYard(id) { let canvas = get('yardCanvas'); if (!canvas) return; canvas.innerHTML = db.slots.filter(s => s.yard_id === id).map(s => `<div class="slot ${selectedSlot === s.id ? 'selected' : ''}" data-id="${s.id}" style="left:${s.x}px;top:${s.y}px"><b>🚛 ${esc(s.name)}</b><small>${slotLots(s.id).length} loại hàng · ${num(slotLots(s.id).reduce((n, l) => n + lotPackages(l.id), 0))} kiện · ${num(slotLots(s.id).reduce((n, l) => n + lotKg(l.id), 0))} kg</small></div>`).join(''); enableDrag(); showSlot() }
        function showSlot() { let s = db.slots.find(x => x.id === selectedSlot), el = get('slotInfo'); if (!el) return; if (!s) { el.innerHTML = '<h2>Chi tiết container</h2><p class="muted">Chọn một container trên sơ đồ.</p>'; return } el.innerHTML = `<h2>${esc(s.name)}</h2><p class="muted">Bãi: ${esc(yardName(s.yard_id))}</p>${slotLots(s.id).map(l => `<div style="padding:12px 0;border-bottom:1px solid #edf1f6"><b>${esc(l.product)}</b><div class="muted">${esc(l.customer)} · ${esc(l.source_cont)}</div><strong>${num(lotPackages(l.id))} kiện / ${num(lotKg(l.id))} kg</strong><div class="muted">${num(kgPerPackage(l))} kg/kiện</div></div>`).join('') || '<p class="muted">Container đang trống</p>'}` }
        function enableDrag() { let c = get('yardCanvas'); if (!c) return; if (!c.dataset.ready) { c.dataset.ready = '1'; drawYard(get('yardSelect').value); return } c.querySelectorAll('.slot').forEach(el => { el.onpointerdown = e => { let s = db.slots.find(x => x.id === el.dataset.id), r = c.getBoundingClientRect(), startX = e.clientX, startY = e.clientY, oldX = s.x, oldY = s.y, moved = false; el.setPointerCapture(e.pointerId); el.onpointermove = ev => { let dx = ev.clientX - startX, dy = ev.clientY - startY; if (Math.abs(dx) + Math.abs(dy) > 5) moved = true; s.x = Math.max(0, Math.min(c.clientWidth - el.offsetWidth, oldX + dx)); s.y = Math.max(0, Math.min(c.clientHeight - el.offsetHeight, oldY + dy)); el.style.left = s.x + 'px'; el.style.top = s.y + 'px' }; el.onpointerup = async () => { el.onpointermove = null; el.onpointerup = null; selectedSlot = s.id; if (moved) { try { await update('slots', s.id, { x: Math.round(s.x), y: Math.round(s.y) }) } catch (err) { notice(err.message) } } drawYard(get('yardSelect').value) } } }) }
